name: track-courts

# Each run checks availability every 15 minutes for ~5h40m (GitHub jobs max out at 6 h),
# then starts the next run itself. The hourly schedule is only a backup in case that chain breaks.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: track-courts
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      AUDIT_STOP: "2026-10-24T12:00"   # two weeks after the start; nothing runs after this
      INTERVAL_MIN: "15"
      LOOP_MINUTES: "340"
    steps:
      - uses: actions/checkout@v4

      - name: Check every 15 minutes
        run: bash loop.sh

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 tracker.py --stopped; then echo "audit over, not chaining"; exit 0; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/track.yml/dispatches" -f ref=main
